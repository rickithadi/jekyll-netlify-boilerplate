---
layout: default
---

<section class="hero">
  <div class="hero-content">
    <div class="hero-text">
      <div class="hero-greeting">Get in touch</div>
      <h1 class="hero-title">{{ page.title }}</h1>
      <div class="hero-subtitle">
        {{ page.intro_paragraph | markdownify }}
      </div>
      <div class="hero-links">
        <a href="https://calendly.com/rickithadi/30min" target="_blank" rel="noopener" class="btn btn--primary">Book a 30-Minute Call</a>
        <a href="#contact-form" class="btn btn--secondary">Send a Message</a>
      </div>
    </div>
  </div>
</section>

<section class="section">
  <div class="container">
    {{ content }}
  </div>
</section>
